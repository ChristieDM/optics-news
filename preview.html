<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#054B91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>光学行业新闻热点</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
/* v6：页面推入/返回、卡片展开、面板、提示等动效；左右滑动切换日期；首页隐藏当日无条目的板块。
   v7：展开卡片的「分析」下方加「事实核查」（factcheck：状态 / 核查时间 / 每条说法的核对结果与来源）；收起时 meta 末尾小字 ✓已核实。
   v5：首页只有 分类 + 一句话总结；点进分类看新闻列表（卡片默认只显示 结论标题 / 对舜宇影响 / 来源时间） */
:root{--brand:#054B91;--soft:#E7EFF9;--ink:#054B91;--bg:#EEF2F7;--card:#fff;--text:#0B1220;--text2:#2B3546;--meta:#5B6576;--line:#E3E8F0;
  --bad:#C0392B;--good:#11803F;--neu:#7A8494;--ana:#FFF8E6;--ana-line:#E9C46A;--ana-ink:#7A5200;--mark:#FFE58A;--shade:rgba(2,22,48,.07);--fc-a:#B26A00;--fc-a-bg:#FFF1D6;--fc-g-bg:#E3F4EA;--fc-n-bg:#EEF1F5}
:root[data-theme=dark]{--bg:#07111F;--card:#0F1E33;--text:#F3F6FB;--text2:#D3DCE8;--meta:#9DAABD;--line:#22344D;--soft:#123A66;--ink:#8EC0FF;
  --bad:#FF8A7E;--good:#74DB9C;--neu:#9DAABD;--ana:#2A2312;--ana-line:#8A6D1E;--ana-ink:#F2D58A;--mark:#7A5E00;--shade:rgba(0,0,0,.3);--fc-a:#F2B65A;--fc-a-bg:#3A2A10;--fc-g-bg:#123323;--fc-n-bg:#1C2A3D}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07111F;--card:#0F1E33;--text:#F3F6FB;--text2:#D3DCE8;--meta:#9DAABD;--line:#22344D;--soft:#123A66;--ink:#8EC0FF;
  --bad:#FF8A7E;--good:#74DB9C;--neu:#9DAABD;--ana:#2A2312;--ana-line:#8A6D1E;--ana-ink:#F2D58A;--mark:#7A5E00;--shade:rgba(0,0,0,.3);--fc-a:#F2B65A;--fc-a-bg:#3A2A10;--fc-g-bg:#123323;--fc-n-bg:#1C2A3D}}
html{font-size:17px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.65;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
a{color:var(--ink);text-decoration:none}button{font:inherit;color:inherit}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
b.n{font-weight:700}
/* 顶栏 */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px rgba(2,22,48,.18)}
.row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:6px 4px 2px 14px;min-height:52px}
.row img{width:26px;height:26px;border-radius:7px;background:#fff;margin-right:4px}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.row .tt{font-size:1rem;letter-spacing:-.2px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{flex:none;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:0 12px;min-height:34px;font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap}
.ib{background:none;border:0;color:#fff;min-width:40px;padding:0;min-height:44px;font-size:1.15rem;cursor:pointer;border-radius:10px;line-height:1}
.back{background:rgba(255,255,255,.16);border:0;color:#fff;min-height:36px;padding:0 12px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;margin-right:6px}
.sbox{flex:1;display:flex;align-items:center;background:#fff;border-radius:999px;padding:0 12px;min-height:38px;margin-right:10px}
.sbox input{flex:1;border:0;outline:0;font:inherit;font-size:1rem;background:none;color:#0B1220;min-width:0}
.tabs{max-width:760px;margin:0 auto;display:flex;overflow-x:auto;padding:0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-size:.94rem;color:rgba(255,255,255,.75);background:none;border:0;padding:4px 11px 12px;min-height:42px;cursor:pointer;position:relative}
.tabs button.on{color:#fff;font-weight:700}
.tabs button.on:after{content:"";position:absolute;left:28%;right:28%;bottom:5px;height:3px;border-radius:2px;background:#fff}
.tabs sup{font-size:.62rem;opacity:.8;margin-left:2px;font-weight:600}
main{max-width:760px;margin:0 auto;padding:12px 14px calc(78px + env(safe-area-inset-bottom))}
/* 底栏 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bar nav{max-width:760px;margin:0 auto;display:flex}
.bar button{flex:1;background:none;border:0;min-height:54px;cursor:pointer;color:var(--meta);font-size:.74rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar button.on{color:var(--ink)}
/* 一分钟简报 */
.brief{background:var(--card);border-radius:16px;padding:14px 16px 12px;box-shadow:0 1px 2px var(--shade)}
.brief h2{margin:0 0 4px;font-size:1.06rem;display:flex;align-items:baseline;gap:8px}
.brief h2 small{margin-left:auto;font-size:.72rem;color:var(--meta);font-weight:500}
.brief ul{margin:0;padding:0;list-style:none}
.brief li{position:relative;padding:7px 0 7px 14px;font-size:.96rem;color:var(--text2);border-top:1px solid var(--line)}
.brief li:first-child{border-top:0}
.brief li:before{content:"";position:absolute;left:0;top:17px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.brief li b{color:var(--text)}
.brief li .x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brief.open li .x{display:block}
.bmore{background:none;border:0;color:var(--ink);font-size:.8rem;font-weight:700;padding:2px 0 4px;cursor:pointer;min-height:30px}
.kn{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 0;padding:8px 16px 2px;border-top:1px solid var(--line);scrollbar-width:none}.kn::-webkit-scrollbar{display:none}
.kn button{flex:none;border:0;background:var(--bg);border-radius:10px;padding:5px 10px;text-align:left;cursor:pointer;line-height:1.3}
.kn .l{display:block;font-size:.68rem;color:var(--meta)}.kn .v{font-size:.86rem;font-weight:700}.kn .d{font-size:.74rem;color:var(--meta);margin-left:4px}
.kn-h{font-size:.68rem;color:var(--meta);margin-top:4px}
/* 列表头 */
.lh{display:flex;align-items:center;gap:10px;margin:18px 2px 8px}
.lh h3{margin:0;font-size:1.02rem;flex:1;min-width:0}
.lh h3 small{font-size:.76rem;color:var(--meta);font-weight:500;margin-left:6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.seg button{border:0;background:none;min-height:30px;padding:0 12px;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--meta);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.tip{font-size:.8rem;color:var(--ana-ink);margin:-2px 2px 10px}
/* 卡片 */
.it{position:relative;background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 2px var(--shade)}
.hd{padding:13px 50px 12px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ttl{font-size:1.06rem;line-height:1.5;font-weight:700}
.it.read .ttl{color:var(--meta);font-weight:600}
.imp{margin-top:6px;font-size:.9rem;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.open .imp{display:block}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dir{font-weight:700;margin-right:2px}
.up{color:var(--bad)}.dot.up{background:var(--bad)}.ok{color:var(--good)}.dot.ok{background:var(--good)}.nu{color:var(--neu)}.dot.nu{background:var(--neu)}
.al{font-size:.74rem;color:var(--ana-ink);margin-right:4px}
.meta{margin-top:6px;font-size:.78rem;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .of{color:var(--ink);font-weight:600}
.meta .hl{color:var(--bad);font-weight:700}
.rc{position:absolute;top:6px;right:4px;width:44px;height:44px;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.rc i{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);font-style:normal;font-size:.74rem;font-weight:900;line-height:1;color:transparent;background:var(--card)}
.rc.on i{background:var(--line);border-color:var(--line);color:var(--meta)}
.body{display:none;padding:0 16px 12px;border-top:1px solid var(--line);margin:0 0 0}
.it.open .body{display:block}
.sum{margin:10px 0 0;font-size:.94rem;color:var(--text2)}
.sum .lb,.ana .lb{display:block;font-size:.72rem;font-weight:700;color:var(--meta);margin-bottom:2px}
.ana{margin-top:10px;background:var(--ana);border-left:3px solid var(--ana-line);border-radius:8px;padding:8px 12px;font-size:.9rem;color:var(--text2)}
.ana .lb{color:var(--ana-ink)}
/* v7 事实核查 */
.fc{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:7px 12px 8px;font-size:.84rem;color:var(--text2)}
.fc .fh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.72rem;color:var(--meta);margin-bottom:3px}
.fc .fh b{font-weight:700;color:var(--meta)}
.fc .ck{margin-left:auto}
.fp{display:inline-block;padding:1px 7px;border-radius:999px;font-size:.7rem;font-weight:700;line-height:1.5}
.fp.g{background:var(--fc-g-bg);color:var(--good)}.fp.a{background:var(--fc-a-bg);color:var(--fc-a)}.fp.n{background:var(--fc-n-bg);color:var(--neu)}
.fc ul{list-style:none;margin:0;padding:0}
.fc li{position:relative;padding:3px 0 3px 20px;line-height:1.45}
.fc li+li{border-top:1px dashed var(--line)}
.fc li i{position:absolute;left:0;top:4px;width:15px;height:15px;border-radius:50%;font-style:normal;font-size:.66rem;font-weight:800;line-height:15px;text-align:center;color:#fff}
.fc li i.g{background:var(--good)}.fc li i.a{background:var(--fc-a)}.fc li i.n{background:var(--neu)}
:root[data-theme=dark] .fc li i{color:var(--card)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .fc li i{color:var(--card)}}
.fc li a{color:var(--ink);text-decoration:none;white-space:nowrap;font-size:.78rem}
.fc li .vd{font-size:.72rem;font-weight:700;margin-right:3px}
.fc li .vd.a{color:var(--fc-a)}.fc li .vd.n{color:var(--neu)}
.fc .fn2{margin-top:4px;font-size:.74rem;color:var(--meta);line-height:1.45}
.meta .fcm{color:var(--good);font-weight:600}.meta .fcm.a{color:var(--fc-a)}
.foot{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.82rem}
.foot a.s{font-weight:700;padding:6px 0}
.tag{color:var(--meta);font-size:.78rem;background:none;border:0;padding:4px 0;cursor:pointer}
.fav{margin-left:auto;background:none;border:0;font-size:.82rem;min-height:36px;padding:0 4px;cursor:pointer;color:var(--meta);font-weight:600}
.fav.on{color:#C88A00}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 4px;padding:0 14px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:.84rem;font-weight:600;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text2);cursor:pointer}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.intro{font-size:.84rem;color:var(--meta);margin:6px 2px 10px}
.empty{background:var(--card);border-radius:14px;padding:26px 18px;text-align:center;color:var(--meta);font-size:.94rem}
.go{display:inline-block;margin-top:12px;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:40px}
.err{background:var(--card);border-radius:14px;padding:18px}
/* v5 首页：分类磁贴 */
.hh{display:flex;align-items:baseline;gap:8px;margin:4px 2px 10px}
.hh h2{margin:0;font-size:1.12rem}
.hh small{font-size:.78rem;color:var(--meta)}
.gh{font-size:.78rem;font-weight:700;color:var(--meta);margin:16px 4px 8px;letter-spacing:.5px}
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:0;border-left:4px solid var(--brand);border-radius:14px;padding:12px 14px 12px 14px;box-shadow:0 1px 2px var(--shade);cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.tile:active{background:var(--soft)}
.tile.risk{border-left-color:var(--bad)}
.tile.none{opacity:.62;padding-top:9px;padding-bottom:9px}.tile.none .chev{top:11px}
.t1{display:flex;align-items:center;gap:8px;padding-right:18px}
.t1 b{font-size:1.04rem;color:var(--text)}
.t1 .dir{font-size:.76rem}
.cnt{margin-left:auto;font-size:.76rem;color:var(--meta);white-space:nowrap}
.cnt em{font-style:normal;color:var(--ink);font-weight:700}
.chev{position:absolute;right:10px;top:14px;width:16px;height:16px;fill:none;stroke:var(--meta);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t2{margin-top:5px;font-size:.95rem;line-height:1.55;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k{display:inline-block;font-size:.66rem;font-weight:700;color:var(--ana-ink);background:var(--ana);border:1px solid var(--ana-line);border-radius:5px;padding:0 4px;margin-right:6px;vertical-align:2px;line-height:1.5}
.k.f{color:var(--meta);background:none;border-color:var(--line)}
.fn{font-size:.76rem;color:var(--meta);margin:14px 4px 0;line-height:1.6}
/* v5 分类页顶部：本板块一句话总结 */
.csum{background:var(--card);border-radius:14px;padding:11px 14px;box-shadow:0 1px 2px var(--shade);font-size:.96rem;color:var(--text2);line-height:1.6}
.csum .dir{margin-right:4px}
.kn.inpage{margin:10px -14px 0;padding:0 14px 2px;border-top:0}
.kn.inpage button{background:var(--card);box-shadow:0 1px 2px var(--shade)}
/* 弹出面板（日期 / 菜单） */
.mask{position:fixed;inset:0;z-index:40;background:rgba(2,12,28,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:80vh;overflow:auto;background:var(--card);color:var(--text);border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h4{margin:4px 0 8px;font-size:1rem}
.dl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 4px;cursor:pointer;text-align:center;line-height:1.3}
.dc b{display:block;font-size:.92rem}.dc small{display:block;font-size:.68rem;color:var(--meta)}
.dc.on{background:var(--brand);border-color:var(--brand);color:#fff}.dc.on small{color:rgba(255,255,255,.85)}
.cal{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.9rem;color:var(--text2)}
.cal input{flex:1;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.mi{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 2px;text-align:left;cursor:pointer;font-size:.96rem}
.mi:first-of-type{border-top:0}
.mi span{flex:1}.mi small{color:var(--meta);font-size:.82rem}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--brand)}.sw.on:after{left:21px}
.th{display:flex;gap:6px}.th button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer}
.th button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.about{font-size:.84rem;color:var(--text2);background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:6px}
.about p{margin:0 0 6px}.about p:last-child{margin:0}

/* ---------- v6 动效（只用 transform / opacity；高度展开除外） ---------- */
html{overflow-x:hidden}body{overflow-x:clip}
main{touch-action:pan-y}
.kn,.chips{touch-action:pan-x pan-y}
#app.anim{position:relative;z-index:16}
#app.anim.pp{background:var(--bg);box-shadow:-10px 0 28px rgba(2,22,48,.14)}
.ghost{position:fixed;z-index:14;pointer-events:none;will-change:transform,opacity}
.ghost.top{z-index:17}
.ghost.pp{background:var(--bg)}
.ghost.pp.top{box-shadow:-10px 0 28px rgba(2,22,48,.16)}
.hd{position:relative}
.rc{z-index:2}
.cv{position:absolute;right:15px;bottom:13px;width:16px;height:16px;fill:none;stroke:var(--meta);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.it.x .cv{transform:rotate(180deg)}
.tile,.dc,.go,.chips button,.seg button,.bar button,.back,.dbtn,.da,.fav,.ib,.kn button{transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s}
.tile:active{transform:scale(.97)}
.dc:active,.go:active,.chips button:active,.back:active,.dbtn:active,.da:active,.ib:active,.kn button:active,.seg button:active{transform:scale(.94)}
.bar button:active{transform:scale(.9)}
.mi{transition:background-color .15s}.mi:active{background:var(--bg)}
.rc i{transition:background-color .22s,border-color .22s,color .22s}
.dnav{display:flex;align-items:center;flex:none}
.da{background:none;border:0;color:#fff;min-width:28px;min-height:40px;padding:0;font-size:1.4rem;line-height:1;cursor:pointer;font-weight:700;-webkit-tap-highlight-color:transparent}
.da:disabled{opacity:.3;cursor:default}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:86vw;bottom:calc(70px + env(safe-area-inset-bottom));z-index:50;background:rgba(11,18,32,.92);color:#fff;font-size:.86rem;font-weight:600;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.22);pointer-events:none;opacity:0}
:root[data-theme=dark] .toast{background:rgba(232,240,250,.95);color:#0B1220}
.mask{-webkit-tap-highlight-color:transparent}
.sheet{will-change:transform}
.sheet .grip{width:40px;height:5px;margin:2px auto 10px;padding:0;box-sizing:content-box;border:8px solid transparent;border-width:6px 30px;background-clip:padding-box;cursor:grab}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app">加载中…</main>
<div class="bar"><nav id="bar"></nav></div>
<div id="sheet"></div>
<script>
(function(){
"use strict";
var PJ=null,BOPEN=false,NEWS=null,RISKS=null,TICK=null,riskSub="全部",lastQ="",lastList=[],OPEN={};
var selDate=null,rf="全部"; /* selDate: null=今天（自动）、"all"=全部日期、或 YYYY-MM-DD；rf: 全部 / 未读 */
try{selDate=sessionStorage.getItem("on-date")||null;rf=sessionStorage.getItem("on-rf")||"全部";}catch(e){}
function saveUi(){try{if(selDate)sessionStorage.setItem("on-date",selDate);else sessionStorage.removeItem("on-date");sessionStorage.setItem("on-rf",rf);}catch(e){}}
var app=document.getElementById("app"),top=document.getElementById("top"),bar=document.getElementById("bar"),sheet=document.getElementById("sheet");

function sumDay(d){var S=NEWS.summaries||{};if(d!=="all")return d;var k=Object.keys(S).sort();return k.length?k[k.length-1]:d;}

  if(e&&(typeof e==="string"||e.text))return{text:typeof e==="string"?e:e.text,dir:typeof e==="object"?e.dir:null,kind:"总结"};

}
function dirOf(list,get){var g=0,b=0;list.forEach(function(n){var x=get(n);if(x==="利好")g++;else if(x==="利空")b++;});return !list.length?null:g>b?"利好":b>g?"利空":"中性";}

  var day=!edge&&(LV==="home"||LV==="feed")&&!(t.closest&&t.closest(".kn,.chips,input,.top,.bar,#toast"));
  if(!edge&&!day)return;
  TS={x:p.clientX,y:p.clientY,t:Date.now(),mode:edge?"edge":"day",ax:null,dx:0,newer:day?stepTo(1):null,older:day?stepTo(-1):null};
},{passive:true});
document.addEventListener("touchmove",function(e){
  if(!TS)return;var p=e.touches[0],dx=p.clientX-TS.x,dy=p.clientY-TS.y;
  if(TS.ax===null){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;TS.ax=Math.abs(dx)>Math.abs(dy)*1.3?"x":"y";if(TS.ax==="x"){endTx();if(TS.mode==="edge")app.classList.add("anim","pp");}}
  if(TS.ax!=="x"){TS=null;return;}
  if(e.cancelable)e.preventDefault();
  if(TS.mode==="edge"){TS.dx=Math.max(0,dx);app.style.transform="translateX("+TS.dx+"px)";}
  else{var ok=dx<0?TS.newer:TS.older;TS.dx=ok?dx*.6:dx*.18;TS.ok=!!ok;app.style.transform="translateX("+TS.dx+"px)";app.style.opacity=ok?String(1-Math.min(.45,Math.abs(dx)/700)):"";}
},{passive:false});
function tEnd(cancel){
  if(!TS)return;var s=TS;TS=null;if(s.ax!=="x")return;
  SUPPRESS=Date.now();var v=s.dx/Math.max(1,Date.now()-s.t);
  if(cancel){springBack();return;}
  if(s.mode==="edge"){if(s.dx>window.innerWidth*.33||(v>.45&&s.dx>30)){NEXTKIND="pop";POPFROM=s.dx;if(NAV>0){lastBack=true;history.back();}else go("首页");}else springBack();return;}
  var dir=s.dx<0?1:-1,to=dir>0?s.newer:s.older;
  if(to&&(Math.abs(s.dx)>36||Math.abs(v)>.3))setDay(to,dir>0?"dnext":"dprev",s.dx);else springBack();
}
document.addEventListener("touchend",function(){tEnd(false);});
document.addEventListener("touchcancel",function(){tEnd(true);});
sheet.addEventListener("touchstart",function(e){SS=null;var s=e.target.closest&&e.target.closest(".sheet");if(!s||e.target.closest("input"))return;if(s.scrollTop>0&&!e.target.closest(".grip"))return;SS={y:e.touches[0].clientY,t:Date.now(),s:s,dy:0};},{passive:true});
sheet.addEventListener("touchmove",function(e){if(!SS)return;var dy=e.touches[0].clientY-SS.y;if(dy<=0){SS.s.style.transform="";SS.dy=0;return;}if(e.cancelable)e.preventDefault();SS.dy=dy;SS.s.style.transform="translateY("+dy+"px)";},{passive:false});
sheet.addEventListener("touchend",function(){if(!SS)return;var s=SS;SS=null;if(!s.dy)return;var v=s.dy/Math.max(1,Date.now()-s.t);
  if(s.dy>90||(v>.5&&s.dy>24)){SUPPRESS=Date.now();closeSheet(s.dy);}else{var tr=s.s.style.transform;s.s.style.transform="";if(canAnim())s.s.animate([{transform:tr},{transform:"none"}],{duration:220,easing:E});}});
function start(){
  Promise.all([load("news.json"),load("risks.json"),load("ticker.json",true)]).then(function(d){var first=!NEWS;NEWS=d[0];RISKS=d[1];TICK=d[2];lastV="";render(true,first?"init":null);})
  .catch(function(err){top.innerHTML='<div class="row"><span class="tt">光学行业新闻热点</span></div>';app.innerHTML='<p class="err">数据加载失败：'+esc(err.message)+'。请检查网络后下拉刷新。</p>';});
}
window.OpticsNewsReload=start;start();
})();
