<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#054B91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>光学行业新闻热点</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--brand:#054B91;--brand-dark:#033767;--brand-soft:#E7EFF9;--ink:#054B91;--bg:#F2F5F9;--card:#fff;--text:#0B1220;--text2:#1F2A3D;--meta:#4A5568;--line:#E3E8F0;
  --red:#C8102E;--up:#B42318;--up-bg:#FDECEA;--ok:#11703A;--ok-bg:#E6F4EC;--neu:#3D4A5C;--neu-bg:#EEF1F5;--ana:#FFF8E6;--ana-line:#E9C46A;--ana-ink:#7A5200;--mark:#FFE58A;--hdr:100px}
@media (prefers-color-scheme:dark){:root{--bg:#07111F;--card:#0F1E33;--text:#F3F6FB;--text2:#D9E1EC;--meta:#A9B6C8;--line:#22344D;--brand-soft:#123A66;--ink:#8EC0FF;
  --red:#FF7A8A;--up:#FF9A8F;--up-bg:#3A1A1A;--ok:#7BE0A4;--ok-bg:#12321F;--neu:#C8D2DF;--neu-bg:#1E2C40;--ana:#2A2312;--ana-line:#8A6D1E;--ana-ink:#F2D58A;--mark:#7A5E00}}
html{font-size:17px}@supports (font:-apple-system-body){html{font:-apple-system-body}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
a{color:var(--ink);text-decoration:none}button{font:inherit;color:inherit}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px rgba(2,22,48,.18)}
.brand{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 6px 16px;min-height:52px}
.brand img{width:28px;height:28px;border-radius:7px;background:#fff}
.brand b{font-size:1.06rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .upd{font-size:.72rem;opacity:.85;white-space:nowrap}
.ib{background:none;border:0;color:#fff;min-width:44px;min-height:44px;font-size:1.1rem;cursor:pointer;border-radius:10px}
.back{background:rgba(255,255,255,.16);border:0;color:#fff;min-height:40px;padding:0 12px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap}
.sbox{flex:1;display:flex;align-items:center;background:#fff;border-radius:999px;padding:0 12px;min-height:40px}
.sbox input{flex:1;border:0;outline:0;font:inherit;font-size:1rem;background:none;color:#0B1220;min-width:0}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font-size:.94rem;color:rgba(255,255,255,.78);background:none;border:0;padding:6px 10px 12px;min-height:44px;cursor:pointer;position:relative;font-weight:500}
.tabs button.on{color:#fff;font-weight:700}
.tabs button.on:after{content:"";position:absolute;left:30%;right:30%;bottom:5px;height:3px;border-radius:2px;background:#fff}
.tabs .n{display:inline-block;min-width:16px;font-size:.66rem;line-height:16px;border-radius:8px;background:rgba(255,255,255,.22);margin-left:3px;padding:0 4px;vertical-align:1px}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);box-shadow:0 -1px 0 var(--line),0 -4px 14px rgba(2,22,48,.06);padding-bottom:env(safe-area-inset-bottom)}
.bar nav{max-width:760px;margin:0 auto;display:flex}
.bar button{flex:1;background:none;border:0;min-height:56px;cursor:pointer;color:var(--meta);font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.bar button .i{font-size:1.3rem;line-height:1.1;filter:grayscale(1);opacity:.75}
.bar button.on{color:var(--ink)}.bar button.on .i{filter:none;opacity:1}
.bar .bd{position:absolute;top:5px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:.62rem;line-height:16px;min-width:16px;padding:0 4px;border-radius:8px}
/* 简报 */
.brief{background:var(--card);border-radius:18px;padding:16px 18px;border-left:5px solid var(--brand);box-shadow:0 1px 2px rgba(2,22,48,.08)}
.brief h2{margin:0;font-size:1.12rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brief h2 small{font-size:.72rem;color:var(--meta);font-weight:500}
.brief ol{margin:8px 0 0;padding-left:1.3em}.brief li{margin:6px 0;font-size:.96rem;color:var(--text2)}
.brief li::marker{color:var(--ink);font-weight:800}
.hero{margin-top:14px;background:linear-gradient(135deg,#054B91,#0A63BC);color:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 18px rgba(5,75,145,.28)}
.hero .k{font-size:.77rem;font-weight:700;letter-spacing:.5px;opacity:.9}
.hero .big{font-size:2.6rem;line-height:1.1;font-weight:800;margin:6px 0 2px}
.hero .t{font-size:1.18rem;line-height:1.4;font-weight:700}
.hero ul{margin:12px 0 0;padding:0;list-style:none}
.hero li{border-top:1px solid rgba(255,255,255,.22);padding:10px 0 2px;font-size:.94rem;cursor:pointer}
.hero li a{color:#fff;opacity:.9;font-size:.8rem;font-weight:600}
.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.strip-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;gap:8px}
.strip-h b{font-size:1rem;white-space:nowrap}.strip-h span{font-size:.72rem;color:var(--meta);text-align:right}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.q{flex:none;width:150px;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(2,22,48,.08);border:0;cursor:pointer;text-align:left;color:var(--text)}
.q .l{font-size:.77rem;color:var(--meta);font-weight:600}.q .v{font-size:1.22rem;font-weight:800;line-height:1.3;margin-top:2px}
.q .d{font-size:.8rem;font-weight:700}.q .dt{font-size:.68rem;color:var(--meta);margin-top:2px}
.pos{color:var(--red)}.neg{color:#0F8A4B}@media (prefers-color-scheme:dark){.neg{color:#7BE0A4}}
.sec{display:flex;align-items:center;gap:8px;margin:22px 2px 8px;font-size:1.06rem;font-weight:800}
.sec:before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
.sec .r{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--ink);background:none;border:0;cursor:pointer;min-height:36px}
.mini{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(2,22,48,.06)}
.mini .rk{display:inline-flex;width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;font-size:.77rem;font-weight:800;align-items:center;justify-content:center;margin-right:8px;vertical-align:2px}
.mini .t{font-weight:700;font-size:1.02rem;line-height:1.45}
.mini .s{font-size:.88rem;color:var(--text2);margin-top:6px;cursor:pointer}
.day{position:sticky;top:var(--hdr);z-index:5;background:var(--bg);font-size:.82rem;font-weight:800;color:var(--ink);padding:10px 2px 6px}
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:16px}
.it{position:relative;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(2,22,48,.07)}
.it:before{content:"";position:absolute;left:-24px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--brand)}
.it.hot:before{border-color:var(--red);background:var(--red)}
.it.hot .ttl{color:var(--red)}
.it.read .ttl{color:var(--meta)}.it.read:before{border-color:var(--line);background:var(--line)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:.77rem;color:var(--meta);font-weight:500}
.ttl{margin:6px 0 4px;font-size:1.1rem;line-height:1.45;font-weight:700}
.sum{margin:0;font-size:.94rem;color:var(--text2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.it.open .sum{display:block;-webkit-line-clamp:unset}
.more{display:none;background:none;border:0;color:var(--ink);font-weight:700;font-size:.82rem;padding:6px 0 0;min-height:32px;cursor:pointer}
.it.clamped .more{display:inline-block}
.num{font-weight:700;color:var(--ink)}.it.hot .ttl .num,.it.read .ttl .num{color:inherit}
.ana{margin-top:10px;background:var(--ana);border:1px dashed var(--ana-line);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--text2)}
.ana .h{font-size:.72rem;font-weight:800;color:var(--ana-ink);letter-spacing:.3px;margin-bottom:4px}
.ana .r{margin:3px 0}.ana .r b{color:var(--text);font-weight:700;margin-right:4px}
.foot{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem}
.foot a.s{font-weight:600}
.tag{color:var(--meta);font-size:.77rem;background:none;border:0;padding:4px 0;cursor:pointer}
.fav{margin-left:auto;background:none;border:0;font-size:1.25rem;min-width:44px;min-height:40px;cursor:pointer;color:var(--meta)}
.fav.on{color:#E0A100}
.chip{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;line-height:1;border-radius:999px;padding:4px 8px;white-space:nowrap}
.c-off{color:var(--ink);background:var(--brand-soft)}.c-hot{color:#fff;background:var(--red)}.c-new{color:#fff;background:#E8590C}
.c-up{color:var(--up);background:var(--up-bg)}.c-ok{color:var(--ok);background:var(--ok-bg)}.c-neu{color:var(--neu);background:var(--neu-bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
.filters button{font-size:.82rem;font-weight:600;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text2);cursor:pointer}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.intro{font-size:.86rem;color:var(--meta);margin:0 2px 8px}
.empty{background:var(--card);border-radius:16px;padding:28px 18px;text-align:center;color:var(--meta);font-size:.94rem}
.note{font-size:.86rem;color:var(--text2);background:var(--card);border-radius:14px;padding:14px 16px;margin:0}
.foot-note{font-size:.77rem;color:var(--meta);margin:16px 2px 0}
.err{background:var(--card);border-radius:14px;padding:18px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app">加载中…</main>
<div class="bar"><nav id="bar"></nav></div>
<script>
(function(){
"use strict";
var NEWS=null,RISKS=null,TICK=null,riskSub="全部",flt="全部",lastQ="";
var app=document.getElementById("app"),top=document.getElementById("top"),bar=document.getElementById("bar");
/* ---------- 本机存储（已读 / 收藏 / 新条目） ---------- */
var mem={};
function sget(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return mem[k]||null;}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;}}
function setOf(k){var a=sget(k);return Array.isArray(a)?a:[];}
var READ=setOf("on-read"),FAV=setOf("on-fav"),NEW=[];
function isRead(id){return READ.indexOf(id)>=0;}
function isFav(id){return FAV.indexOf(id)>=0;}
function markRead(id){if(!isRead(id)){READ.push(id);sset("on-read",READ);}}
function toggleFav(id){var i=FAV.indexOf(id);if(i>=0)FAV.splice(i,1);else FAV.unshift(id);sset("on-fav",FAV);}
function computeNew(){
  var all=NEWS.items.map(function(n){return n.id;}),seen=sget("on-seen"),sess=null;
  try{sess=JSON.parse(sessionStorage.getItem("on-new")||"null");}catch(e){}
  if(Array.isArray(seen)){NEW=all.filter(function(id){return seen.indexOf(id)<0;}).concat(sess||[]).filter(function(v,i,a){return a.indexOf(v)===i&&all.indexOf(v)>=0;});}
  else{ // 首次打开：最近 48 小时内的条目算“新”
    var max=NEWS.items.reduce(function(m,n){return n.date>m?n.date:m;},""),lim=new Date(new Date(max+"T00:00:00+08:00").getTime()-2*864e5).toISOString().slice(0,10);
    NEW=(sess||NEWS.items.filter(function(n){return n.date>=lim;}).map(function(n){return n.id;}));
  }
  try{sessionStorage.setItem("on-new",JSON.stringify(NEW));}catch(e){}
  sset("on-seen",all);
}
function isNew(id){return NEW.indexOf(id)>=0&&!isRead(id);}
/* ---------- 工具 ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var NUM=/([+\-−]?\d[\d,]*(?:\.\d+)?\s?(?:%|亿元|亿部|亿|万台|万件|万元|万|元|港元|新台币|美元|部|台|mm|g|倍|分钟|个工作日)?)/g;
function hiNum(s){return esc(s).replace(NUM,function(m){return /[%亿万元部台mg倍钟日]/.test(m)||/^[+\-−]/.test(m)||/\./.test(m)?'<span class="num">'+m+'</span>':m;});}
function hi(s){ // 数字高亮 + 搜索词高亮
  s=String(s==null?"":s);if(!lastQ)return hiNum(s);
  var out="",low=s.toLowerCase(),q=lastQ.toLowerCase(),i=0,j;
  while((j=low.indexOf(q,i))>=0){out+=hiNum(s.slice(i,j))+"<mark>"+hiNum(s.slice(j,j+q.length))+"</mark>";i=j+q.length;}
  return out+hiNum(s.slice(i));
}
function byDate(a,b){return b.date.localeCompare(a.date);}
function load(n,opt){return fetch(n+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(n+" HTTP "+r.status);return r.json();}).catch(function(e){if(opt)return null;throw e;});}
function dirChip(d){var c=d==="利空"?"c-up":d==="利好"?"c-ok":"c-neu",a=d==="利空"?"▼ ":d==="利好"?"▲ ":"● ";return '<span class="chip '+c+'">'+a+esc(d)+'</span>';}
function src(u,s,o,id){return (o?'<span class="chip c-off">✓ 官方</span>':'')+'<a class="s" href="'+esc(u)+'" target="_blank" rel="noopener" data-read="'+esc(id)+'">'+hi(s)+' ↗</a>';}
function favBtn(id){return '<button class="fav'+(isFav(id)?' on':'')+'" data-fav="'+esc(id)+'" aria-label="'+(isFav(id)?'取消收藏':'收藏')+'">'+(isFav(id)?'★':'☆')+'</button>';}
function unread(list){return list.filter(function(n){return !isRead(n.id);}).length;}
function inCat(c){return NEWS.items.filter(function(n){return c==="全部"||n.cats.indexOf(c)>=0;});}
/* ---------- 卡片 ---------- */
function card(n,showCats){
  var cls="it"+(n.headline?" hot":"")+(isRead(n.id)?" read":"");
  var h='<article class="'+cls+'" id="n-'+esc(n.id)+'" data-id="'+esc(n.id)+'"><div class="meta">'+
    (isNew(n.id)?'<span class="chip c-new">新</span>':'')+(n.headline?'<span class="chip c-hot">头条</span>':'')+(n.background?'<span class="chip c-neu">背景</span>':'')+
    (showCats?'<span>'+esc(n.cats.join(" · "))+'</span>':'<span>'+esc(n.date.slice(5))+'</span>')+'</div>'+
    '<div class="ttl">'+hi(n.title)+'</div><p class="sum">'+hi(n.summary)+'</p><button class="more">展开全文</button>';
  if(n.impact||n.takeaway){
    h+='<div class="ana"><div class="h">分析 · 我们的判断（非新闻事实）</div>'+
      (n.impact?'<div class="r"><b>对舜宇影响</b>'+dirChip(n.impact.dir)+' '+hi(n.impact.text)+'</div>':'')+
      (n.takeaway?'<div class="r"><b>启示</b>'+hi(n.takeaway)+'</div>':'')+'</div>';
  }
  h+='<div class="foot">'+src(n.url,n.source,n.official,n.id)+(n.tags||[]).map(function(t){return '<button class="tag" data-tag="'+esc(t)+'">#'+hi(t)+'</button>';}).join("")+favBtn(n.id)+'</div></article>';
  return h;
}
function riskCard(r){
  var id="r:"+r.id;
  return '<article class="it'+(r.severity==="高"?' hot':'')+'" data-id="'+esc(id)+'"><div class="meta">'+dirChip(r.impact)+'<span class="chip c-neu">严重度 '+esc(r.severity)+'</span><span>'+esc(r.sub)+'</span></div>'+
    '<div class="ttl">'+hi(r.title)+'</div><p class="sum">'+hi(r.summary)+'</p><button class="more">展开全文</button><div class="foot">'+src(r.url,r.source,true,id)+favBtn(id)+'</div></article>';
}
function timeline(list,fn){
  var h="",cur="";
  list.forEach(function(x){if(x.date!==cur){if(cur)h+='</div>';cur=x.date;var w="日一二三四五六".charAt(new Date(cur+"T00:00:00+08:00").getDay());h+='<div class="day">'+(+cur.slice(5,7))+' 月 '+(+cur.slice(8))+' 日 · 周'+w+'</div><div class="tl">';}h+=fn(x);});
  return h+(cur?'</div>':'');
}
/* ---------- 顶栏 / 底栏 ---------- */
function route(){
  var h=location.hash.replace(/^#\/?/,"");try{h=decodeURIComponent(h);}catch(e){}
  var p=h.split("/"),a=p[0],b=p.slice(1).join("/");
  if(!a||a==="要闻")return{v:"home"};
  if(a==="快讯")return{v:"feed",c:(b&&NEWS.categories.indexOf(b)>=0)?b:"全部"};
  if(a==="全部")return{v:"feed",c:"全部"};
  if(NEWS.categories.indexOf(a)>=0)return{v:"feed",c:a};
  if(a==="风险"||a==="风险观察")return{v:"risk"};
  if(a==="收藏")return{v:"fav"};
  if(a==="搜索")return{v:"search",q:b};
  if(a==="标签")return{v:"tag",t:b};
  return{v:"home"};
}
function go(path){location.hash="#/"+path.split("/").map(encodeURIComponent).join("/");}
function brandRow(){return '<div class="brand"><img src="icon.png" alt=""><b>光学行业新闻热点</b><span class="upd">更新 '+esc(NEWS.updated.replace(/^\d{4}-/,"").replace("（北京时间）",""))+'</span><button class="ib" data-go="搜索" aria-label="搜索">🔍</button></div>';}
function setTop(r){
  var h;
  if(r.v==="home"||r.v==="feed"){
    var cur=r.v==="home"?"要闻":r.c;
    h=brandRow()+'<nav class="tabs">'+["要闻","全部"].concat(NEWS.categories).map(function(t){
      var n=t==="要闻"?0:unread(inCat(t));
      return '<button data-go="'+(t==="要闻"?"要闻":"快讯/"+t)+'" class="'+(t===cur?'on':'')+'">'+esc(t)+(n?'<span class="n">'+n+'</span>':'')+'</button>';}).join("")+'</nav>';
  }else if(r.v==="search"){
    h='<div class="brand"><button class="back" data-back="1">‹ 返回</button><label class="sbox">🔍&nbsp;<input id="q" type="search" enterkeyhint="search" placeholder="搜索标题、摘要、标签、来源" value="'+esc(r.q||"")+'"></label></div>';
  }else if(r.v==="tag"){
    h='<div class="brand"><button class="back" data-back="1">‹ 返回</button><b>#'+esc(r.t)+'</b><button class="ib" data-go="搜索" aria-label="搜索">🔍</button></div>';
  }else{
    h='<div class="brand"><img src="icon.png" alt=""><b>'+(r.v==="risk"?"风险观察":"我的收藏")+'</b><button class="ib" data-go="搜索" aria-label="搜索">🔍</button></div>';
  }
  top.innerHTML=h;
  var on=top.querySelector(".tabs .on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});
  document.documentElement.style.setProperty("--hdr",top.offsetHeight+"px");
  var nn=NEWS.items.filter(function(n){return isNew(n.id);}).length;
  bar.innerHTML=[["home","要闻","📰","要闻"],["feed","快讯","⏱️","快讯",nn],["risk","风险","⚠️","风险"],["fav","收藏","⭐","收藏",FAV.length]].map(function(b){
    var on=r.v===b[0]||(b[0]==="feed"&&(r.v==="tag"||r.v==="search")&&false);
    return '<button data-go="'+b[1]+'" class="'+(on?'on':'')+'"><span class="i">'+b[2]+'</span>'+b[3]+(b[4]?'<span class="bd">'+b[4]+'</span>':'')+'</button>';}).join("");
}
/* ---------- 页面 ---------- */
function home(){
  var h="";
  if(NEWS.brief&&NEWS.brief.length)h+='<section class="brief"><h2>⏱️ 一分钟简报<small>事实摘自下方条目，判断属分析</small></h2><ol>'+NEWS.brief.map(function(b){return '<li>'+hi(b)+'</li>';}).join("")+'</ol></section>';
  var g1=NEWS.headlines[0];
  if(g1){var it1=NEWS.items.filter(function(n){return n.headline===g1.rank;}),m=(g1.note.match(/[+\-−]?\d+(?:\.\d+)?%/)||[""])[0];
    h+='<section class="hero"><div class="k">今日头条 · 1</div>'+(m?'<div class="big">'+esc(m)+'</div>':'')+'<div class="t">'+esc(g1.note)+'</div><ul>'+
      it1.map(function(n){return '<li data-jump="'+esc(n.id)+'">'+esc(n.date.slice(5))+' · '+esc(n.title)+'<br>'+(n.official?'<span class="chip">✓ 官方</span> ':'')+'<a href="'+esc(n.url)+'" target="_blank" rel="noopener" data-read="'+esc(n.id)+'">'+esc(n.source)+' ↗</a></li>';}).join("")+'</ul></section>';}
  if(TICK&&TICK.items){var ts=TICK.items.filter(function(s){return NEWS.items.some(function(n){return n.id===s.id;});});
    if(ts.length)h+='<div class="strip-h"><b>数据速览</b><span>'+esc((TICK.label||"").replace(/^数据速览 · /,"")||"非实时行情")+'</span></div><div class="strip">'+ts.map(function(s){
      return '<button class="q" data-jump="'+esc(s.id)+'"><div class="l">'+esc(s.label)+'</div><div class="v">'+esc(s.value)+'</div><div class="d '+(s.dir>0?'pos':'neg')+'">'+esc(s.delta)+'</div><div class="dt">'+esc(s.asof)+' · '+esc(s.source)+'</div></button>';}).join("")+'</div>';}
  if(NEWS.headlines.length>1)h+='<div class="sec">要闻</div>'+NEWS.headlines.slice(1).map(function(g){var its=NEWS.items.filter(function(n){return n.headline===g.rank;});
    return '<div class="mini"><div class="t"><span class="rk">'+g.rank+'</span>'+hi(g.note)+'</div>'+its.map(function(n){return '<div class="s" data-jump="'+esc(n.id)+'">'+esc(n.date.slice(5))+' · '+hi(n.title)+' ›</div>';}).join("")+'</div>';}).join("");
  var latest=NEWS.items.slice().sort(byDate);
  h+='<div class="sec">最新快讯<button class="r" data-go="快讯">全部 '+latest.length+' 条 ›</button></div>'+timeline(latest,function(n){return card(n,true);});
  if(NEWS.note)h+='<div class="sec">本期说明</div><p class="note">'+esc(NEWS.note)+'</p>';
  return h;
}
function feed(c){
  var l=inCat(c).sort(byDate),all=l.length;
  if(flt==="只看官方")l=l.filter(function(n){return n.official;});
  if(flt==="只看头条")l=l.filter(function(n){return n.headline;});
  if(flt==="未读")l=l.filter(function(n){return !isRead(n.id);});
  return '<div class="filters">'+["全部","未读","只看官方","只看头条"].map(function(x){return '<button data-f="'+x+'" class="'+(x===flt?'on':'')+'">'+x+'</button>';}).join("")+'</div>'+
    '<p class="intro">'+esc(c==="全部"?"全部频道":c)+' · '+all+' 条，未读 '+unread(inCat(c))+' 条 · <a href="#" data-allread="'+esc(c)+'">全部标为已读</a></p>'+
    (l.length?timeline(l,function(n){return card(n,c==="全部");}):'<div class="empty">没有符合条件的条目。</div>');
}
function risks(){
  var subs=["全部"].concat(RISKS.subs),l=RISKS.items.slice().sort(byDate);if(riskSub!=="全部")l=l.filter(function(r){return r.sub===riskSub;});
  return '<div class="filters">'+subs.map(function(x){return '<button data-rs="'+x+'" class="'+(x===riskSub?'on':'')+'">'+x+'</button>';}).join("")+'</div>'+
    '<p class="intro">影响舜宇的外部风险与机会 · '+l.length+' 条 · 均来自官方或权威来源</p>'+timeline(l,riskCard);
}
function favs(){
  var n=NEWS.items.filter(function(x){return isFav(x.id);}),r=RISKS.items.filter(function(x){return isFav("r:"+x.id);});
  if(!n.length&&!r.length)return '<div class="empty">还没有收藏。<br>点卡片右下角的 ☆ 即可收藏，稍后在这里查看。<br><small>收藏只保存在本机。</small></div>';
  return '<p class="intro">共 '+(n.length+r.length)+' 条 · 仅保存在本机</p>'+(n.length?timeline(n.sort(byDate),function(x){return card(x,true);}):'')+(r.length?'<div class="sec">风险观察</div>'+timeline(r.sort(byDate),riskCard):'');
}
function match(o,q){q=q.toLowerCase();return [o.title,o.summary,o.source,(o.tags||[]).join(" "),(o.cats||[]).join(" "),o.sub||"",o.impact&&o.impact.text||"",o.takeaway||""].join(" ").toLowerCase().indexOf(q)>=0;}
function searchResults(q){
  q=(q||"").trim();lastQ=q;
  if(!q){lastQ="";var tags={};NEWS.items.forEach(function(n){(n.tags||[]).forEach(function(t){tags[t]=(tags[t]||0)+1;});});
    var top=Object.keys(tags).sort(function(a,b){return tags[b]-tags[a];}).slice(0,12);
    return '<p class="intro">热门标签</p><div class="filters">'+top.map(function(t){return '<button data-tag="'+esc(t)+'">#'+esc(t)+' '+tags[t]+'</button>';}).join("")+'</div>';}
  var n=NEWS.items.filter(function(x){return match(x,q);}).sort(byDate),r=RISKS.items.filter(function(x){return match(x,q);}).sort(byDate);
  var h='<p class="intro">「'+esc(q)+'」共 '+(n.length+r.length)+' 条结果</p>';
  if(!n.length&&!r.length)h+='<div class="empty">没有找到相关条目，换个关键词试试。</div>';
  if(n.length)h+=timeline(n,function(x){return card(x,true);});
  if(r.length)h+='<div class="sec">风险观察</div>'+timeline(r,riskCard);
  return h;
}
function tagPage(t){
  var l=NEWS.items.filter(function(n){return (n.tags||[]).indexOf(t)>=0;}).sort(byDate);
  if(!l.length)return '<div class="empty">没有带 #'+esc(t)+' 标签的条目。</div>';
  var dirs={};l.forEach(function(n){if(n.impact)dirs[n.impact.dir]=(dirs[n.impact.dir]||0)+1;});
  return '<p class="intro">专题 · '+l.length+' 条 · '+esc(l[l.length-1].date.slice(5))+' 至 '+esc(l[0].date.slice(5))+(Object.keys(dirs).length?' · 分析：'+Object.keys(dirs).map(function(k){return k+' '+dirs[k];}).join(" / "):'')+'</p>'+timeline(l,function(n){return card(n,true);});
}
function markClamped(){Array.prototype.forEach.call(app.querySelectorAll(".it .sum"),function(p){var c=p.parentNode;c.classList.toggle("clamped",!c.classList.contains("open")&&p.scrollHeight>p.clientHeight+2);});}
var lastV="";
function render(keep){
  if(!NEWS||!RISKS)return;
  var r=route();if(r.v!=="search")lastQ="";
  if(r.v+(r.c||"")!==lastV){flt="全部";}
  setTop(r);
  app.innerHTML=r.v==="home"?home():r.v==="feed"?feed(r.c):r.v==="risk"?risks():r.v==="fav"?favs():r.v==="search"?searchResults(r.q):tagPage(r.t);
  if(r.v!=="search"&&r.v!=="fav")app.innerHTML+='<p class="foot-note">未标“官方”的条目为行情数据、评测或对官方活动的媒体报道；黄色“分析”框为我们的判断，不是新闻事实。</p>';
  markClamped();
  if(!keep&&r.v+(r.c||"")!==lastV)window.scrollTo(0,0);
  lastV=r.v+(r.c||"");
  if(r.v==="search"){var q=document.getElementById("q");if(q&&!r.q&&!keep)q.focus();}
}
function soft(){var y=window.scrollY;render(true);window.scrollTo(0,y);}
document.addEventListener("input",function(e){if(e.target.id!=="q")return;var v=e.target.value;history.replaceState(null,"","#/搜索/"+encodeURIComponent(v));app.innerHTML=searchResults(v);markClamped();});
document.addEventListener("click",function(e){
  var t=e.target;
  var m=t.closest(".more");if(m){var c=m.parentNode;c.classList.add("open");c.classList.remove("clamped");if(c.dataset.id)markRead(c.dataset.id);return;}
  var f=t.closest("[data-fav]");if(f){toggleFav(f.dataset.fav);var on=isFav(f.dataset.fav);f.classList.toggle("on",on);f.textContent=on?"★":"☆";setTop(route());if(route().v==="fav")soft();return;}
  var rd=t.closest("[data-read]");if(rd){markRead(rd.dataset.read);setTimeout(soft,300);return;}
  var ar=t.closest("[data-allread]");if(ar){e.preventDefault();inCat(ar.dataset.allread).forEach(function(n){markRead(n.id);});soft();return;}
  var tg=t.closest("[data-tag]");if(tg){go("标签/"+tg.dataset.tag);return;}
  var j=t.closest("[data-jump]");if(j){var el=document.getElementById("n-"+j.dataset.jump);if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.style.outline="3px solid #C8102E";setTimeout(function(){el.style.outline="";},1600);}return;}
  var fl=t.closest("[data-f]");if(fl){flt=fl.dataset.f;soft();return;}
  var rs=t.closest("[data-rs]");if(rs){riskSub=rs.dataset.rs;soft();return;}
  var bk=t.closest("[data-back]");if(bk){if(history.length>1)history.back();else go("要闻");return;}
  var g=t.closest("[data-go]");if(g){go(g.dataset.go);}
});
window.addEventListener("hashchange",function(){render(false);});
window.addEventListener("resize",function(){markClamped();document.documentElement.style.setProperty("--hdr",top.offsetHeight+"px");});
function start(){
  Promise.all([load("news.json"),load("risks.json"),load("ticker.json",true)]).then(function(d){NEWS=d[0];RISKS=d[1];TICK=d[2];computeNew();lastV="";render(true);})
  .catch(function(err){top.innerHTML='<div class="brand"><b>光学行业新闻热点</b></div>';app.innerHTML='<p class="err">数据加载失败：'+esc(err.message)+'。请检查网络后下拉刷新。</p>';});
}
window.OpticsNewsReload=start;start();
})();
</script>
</body>
</html>
